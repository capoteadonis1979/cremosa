name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar SDK Android 36
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Llave de firma
        run: cp keystore/release.jks app/release.jks

      - name: Compilar APK firmado
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Renombrar
        run: |
          mkdir -p salida
          cp app/build/outputs/apk/release/app-release.apk salida/Cremosa-0.1.apk

      - uses: actions/upload-artifact@v4
        with:
          name: cremosa
          path: salida/*

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1-b${{ github.run_number }}
          name: CREMOSA 0.1
          body: |
            CREMOSA — app de cremes de cabelo.
            Descarregue o ficheiro .apk no telemóvel Android e instale (permita "instalar apps desconhecidas").
          files: salida/*
          make_latest: true
